<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCampus: Your Event Journey • IIIT Delhi</title>
  <meta name="description" content="Intelligent collegiate timeline bringing student hackathons, competitions, workshops, and conference journeys into one organized command center." />
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2zm-8.8 6.4L12 12.3l6.5-2.95L12 6.4 3.2 8.4zM12 14.5l-9-4.09V17l9 5 9-5v-6.59l-9 4.09z'/></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans, Playfair Display, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            collegiate: {
              navy: '#1e3a8a',
              gold: '#d97706',
              dark: '#0b0f19',
              slate: '#131b2e'
            }
          }
        }
      }
    };
  </script>

  <!-- Custom Main Stylesheet -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
  
  <!-- Main App Shell -->
  <div id="app" class="flex flex-col min-h-screen">
    
    <!-- Top Navigation Bar -->
    <div id="navbar-root"></div>

    <!-- Main Content Area -->
    <main class="flex-1 pb-16">
      <!-- Intelligence Metrics & Urgency Radar -->
      <div id="hero-stats-root"></div>

      <!-- Active View Container (Timeline, Calendar, Kanban, Clash Radar) -->
      <div id="view-container" class="transition-opacity duration-150"></div>
    </main>

    <!-- Luxury Collegiate Footer -->
    <footer class="no-print mt-auto py-8 text-xs text-slate-500 dark:text-slate-400">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="glass-panel rounded-2xl px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4 border border-slate-200/80 dark:border-white/10 shadow-lg">
          
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center font-serif font-bold text-xs shadow-md">
              MC
            </div>
            <div>
              <span class="font-serif font-bold text-slate-900 dark:text-white">MyCampus: Your Event Journey</span>
              <span class="block text-[11px] text-slate-400">Indraprastha Institute of Information Technology Delhi</span>
            </div>
          </div>

          <div class="flex items-center space-x-5 text-xs font-medium">
            <span class="flex items-center space-x-1.5 text-emerald-500">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Local Sync Active</span>
            </span>
            <span class="hidden md:inline font-mono text-[11px] text-slate-400">RFC 5545 iCalendar</span>
            <span>Press <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 font-mono text-[10px] text-slate-700 dark:text-slate-300">⌘K</kbd> for Omnibar</span>
          </div>

        </div>
      </div>
    </footer>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/app.js"></script>

</body>
</html>
