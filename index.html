<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCampus — Student Event Journey | IIIT Delhi</title>
  <meta name="description" content="A clean, unified timeline for student hackathons, competitions, workshops, and conference schedules." />
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L1 7l11 5 9-4.09V17h2V7L12 2zm-8.8 6.4L12 12.3l6.5-2.95L12 6.4 3.2 8.4zM12 14.5l-9-4.09V17l9 5 9-5v-6.59l-9 4.09z'/></svg>" />

  <!-- Google Fonts: Modern Human-Designed Typography (Space Grotesk + Plus Jakarta Sans + JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Tailwind CSS CDN with custom config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    };
  </script>

  <!-- Custom Main Stylesheet -->
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#090b10] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
  
  <!-- Main App Shell -->
  <div id="app" class="flex flex-col min-h-screen">
    
    <!-- Top Navigation Bar -->
    <div id="navbar-root"></div>

    <!-- Main Content Area -->
    <main class="flex-1 pb-12">
      <!-- Intelligence Metrics & Urgency Radar & Side AI Ingest -->
      <div id="hero-stats-root"></div>

      <!-- Active View Container (Timeline, Calendar, Kanban, Clash Radar) -->
      <div id="view-container" class="transition-opacity duration-150"></div>
    </main>

    <!-- Bottom Dashboard Footer & Shortcuts -->
    <div id="footer-root"></div>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/app.js"></script>

</body>
</html>
